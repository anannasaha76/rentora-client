<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="rentora-grad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="55%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="rentora-highlight" x1="0" y1="0" x2="0" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="rentora-accent" x1="16" y1="14" x2="36" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="rentora-drop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#047857" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Base with Soft Shadow -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#rentora-grad)" filter="url(#rentora-drop)" />
  <!-- Gloss reflection -->
  <rect x="3" y="3" width="42" height="20" rx="11" fill="url(#rentora-highlight)" />

  <!-- Precision Equipment R Monogram -->
  <!-- Main Structural Stem of 'R' -->
  <rect x="12" y="11" width="5.5" height="26" rx="2.75" fill="#ffffff" />

  <!-- Circulation Loop of 'R' -->
  <path
    d="M14.5 11H24.5C28.642 11 32 14.358 32 18.5C32 22.642 28.642 26 24.5 26H14.5"
    stroke="#ffffff"
    stroke-width="5.5"
    stroke-linecap="round"
  />

  <!-- Forward-Driving Dynamic Leg -->
  <path
    d="M22 24L31.5 35.5C32.2 36.3 33.5 36.3 34.2 35.5C34.8 34.8 34.7 33.8 34 33L25.5 23.5"
    fill="url(#rentora-accent)"
    stroke="url(#rentora-accent)"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Circulation Cycle Arrowhead in Loop -->
  <path
    d="M23.5 22.5L26 25L23.5 27.5"
    stroke="#ffffff"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Precision Equipment Axis Bolt -->
  <circle cx="24.5" cy="18.5" r="2.4" fill="#ffffff" />
  <circle cx="24.5" cy="18.5" r="1.2" fill="#059669" />
</svg>
